name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Expected a semantic version tag such as v1.2.3"
            exit 1
          fi

      - name: Require the tagged commit to be in main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main; then
            echo "::error title=Tag is not in main::Release tags must point to a commit contained in main"
            exit 1
          fi

      - name: Run isolated Secret Service integration test
        run: >-
          dbus-run-session
          --config-file testdata/dbus-session.conf
          -- env SSHX_SECRET_SERVICE_INTEGRATION=1
          go test -race -run '^TestSecretServiceIntegration$' -count=1 ./...

      - name: Run race tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Cross-build release targets without CGO
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -o "${RUNNER_TEMP}/sshx-linux-amd64" .
          file "${RUNNER_TEMP}/sshx-linux-amd64"
          file "${RUNNER_TEMP}/sshx-linux-amd64" | grep -q "statically linked"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -o "${RUNNER_TEMP}/sshx-darwin-arm64" .
          file "${RUNNER_TEMP}/sshx-darwin-arm64"

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
